name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: rust-core
        run: cargo test

  js-tests:
    name: JS unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install (test-only deps, e.g. @solana/web3.js)
        run: npm install
      - name: node --test
        run: node --test tests/*.test.mjs

  id-parity:
    name: JS / Rust id parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify parity
        run: ./scripts/verify-parity.sh

  g-parity:
    name: JS / Rust composed-G parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify G parity
        run: ./scripts/verify-g-parity.sh

  conservation-parity:
    name: JS / Rust conservation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify conservation parity
        run: ./scripts/verify-conservation-parity.sh

  wasm-build:
    name: Build WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build
        working-directory: rust-core
        run: wasm-pack build --target web --out-dir ../public/js/wasm --out-name aiwa_core
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiwa-wasm
          path: public/js/wasm/
