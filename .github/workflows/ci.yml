name: CI

on:
  push:
    branches: [main]
    # A commit that only updates the compiled WASM output (pushed back
    # automatically by wasm-build below) must not re-trigger the whole
    # suite, including wasm-build itself — that would be an infinite
    # loop: build -> commit -> push -> triggers build -> commit -> ...
    paths-ignore:
      - 'public/js/wasm/**'
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: rust-core
        run: cargo test

  js-tests:
    name: JS unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install (test-only deps, e.g. @solana/web3.js)
        run: npm install
      - name: node --test
        run: node --test tests/*.test.mjs

  id-parity:
    name: JS / Rust id parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify parity
        run: bash scripts/verify-parity.sh

  g-parity:
    name: JS / Rust composed-G parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify G parity
        run: bash scripts/verify-g-parity.sh

  conservation-parity:
    name: JS / Rust conservation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify conservation parity
        run: bash scripts/verify-conservation-parity.sh

  wasm-build:
    name: Build WASM package
    runs-on: ubuntu-latest
    # Needed to push the compiled output back to main below. Only
    # granted here, not workflow-wide — every other job stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build
        working-directory: rust-core
        run: wasm-pack build --target web --out-dir ../public/js/wasm --out-name aiwa_core
      - name: Verify WASM build actually produced files
        # Catches exactly the failure mode found in practice: an empty
        # or missing out-dir doesn't fail `wasm-pack build` loudly
        # enough on its own, and upload-artifact only warns (doesn't
        # fail) on zero files by default — so without this check, a
        # silently-empty build would sail through as "successful".
        run: |
          echo "Contents of public/js/wasm/:"
          ls -la public/js/wasm/ || (echo "::error::public/js/wasm/ does not exist — wasm-pack build did not produce output" && exit 1)
          test -f public/js/wasm/aiwa_core.js || (echo "::error::aiwa_core.js is missing from the build output" && exit 1)
          test -f public/js/wasm/aiwa_core_bg.wasm || (echo "::error::aiwa_core_bg.wasm is missing from the build output" && exit 1)
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiwa-wasm
          path: public/js/wasm/
      - name: Commit compiled WASM back to main
        # Only on an actual push to main, never on a pull_request build
        # (a PR from a fork has no push rights, and shouldn't silently
        # commit to main anyway).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/js/wasm/
          if git diff --staged --quiet; then
            echo "WASM output unchanged, nothing to commit."
          else
            git commit -m "chore: update compiled WASM package (automated)"
            git push
          fi
